layout: lumpycat
title: Nacho
---

<style>
    .nacho-page-container {
        text-align: center;
        position: relative;
    }

    /* Top visual hierarchy button for clear screen */
    .clear-btn {
        position: relative;
        z-index: 9999;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: bold;
        background-color: #ffffff;
        color: #000000;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 20px;
    }

    .clear-btn:hover {
        background-color: #dddddd;
    }

    /* Central main picture with click selection disabled */
    .main-nacho-pic {
        max-width: 400px;
        width: 100%;
        height: auto;
        cursor: pointer;
        position: relative;
        z-index: 5;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
    }

    /* Container for spawned falling items */
    #falling-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 100;
        overflow: hidden;
    }

    .falling-nacho {
        position: absolute;
        width: 80px;
        height: auto;
        pointer-events: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
    }
</style>

<div class="nacho-page-container">
    <div>
        <button class="clear-btn" onclick="clearFallingNachos()">Clear Screen</button>
    </div>

    <img src="{{ '/sources/nacho.jpg' | relative_url }}" alt="Nacho" class="main-nacho-pic" id="centralNacho" onclick="spawnNacho()">

    <div id="falling-container"></div>
</div>

<script>
    function spawnNacho() {
        const container = document.getElementById('falling-container');
        const nacho = document.createElement('img');
        
        nacho.src = document.getElementById('centralNacho').src;
        nacho.className = 'falling-nacho';
        
        const randomX = Math.random() * (window.innerWidth - 80);
        nacho.style.left = randomX + 'px';
        nacho.style.top = '-100px';
        
        container.appendChild(nacho);

        let topPos = -100;
        const speed = 3 + Math.random() * 5;
        const fallInterval = setInterval(() => {
            if (topPos > window.innerHeight) {
                clearInterval(fallInterval);
                nacho.remove();
            } else {
                topPos += speed;
                nacho.style.top = topPos + 'px';
            }
        }, 16);
    }

    function clearFallingNachos() {
        const container = document.getElementById('falling-container');
        container.innerHTML = '';
    }
</script>
