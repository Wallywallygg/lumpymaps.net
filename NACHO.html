<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacho</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; /* Prevents scrollbars as images fall */
            position: relative;
        }
        header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            position: relative;
            z-index: 1000; /* Keeps nav menu above falling images */
        }
        header nav, 
        header nav a {
            color: #ffffff;
            text-decoration: none;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        .content {
            text-align: center;
            margin: auto;
            position: relative;
            z-index: 1; /* Main Nacho stays low so falling Nachos cover him */
            pointer-events: none;
        }
        .content img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 8px;
            display: block;
            margin: 0 auto 20px auto;
        }
        .content p {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }
        .tap-hint {
            font-size: 0.9rem;
            color: #888888;
            font-style: italic;
        }
        /* Style for dynamically spawned falling images */
        .falling-nacho {
            position: fixed;
            width: 160px; /* Increased size for bigger falling images */
            height: auto;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10; /* Higher than main Nacho (.content) */
            will-change: transform;
        }
    </style>
</head>
<body>
    <header>
        <nav style="font-size: 2em;">
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="sources/GISPortfolio.pdf">GIS Portfolio</a> |
            <a href="projects.html">Projects</a> |
            <a href="lumpy.html">Lumpy</a>
        </nav>
    </header>

    <div class="content">
        <img id="nacho-img" src="images/nacho.jpg" alt="Nacho the dog">
        <p>Good boy Nacho</p>
        <div id="hint" class="tap-hint">(Tap anywhere to drop Nachos)</div>
    </div>

    <!-- Clear Sound -->
    <audio id="sound-clear" src="sources/tacobell2.mp3" preload="auto"></audio>

    <script>
        const soundClear = document.getElementById('sound-clear');
        const hint = document.getElementById('hint');
        
        let fallingNachos = [];
        const MAX_NACHOS = 150; // Heap load before screen clears

        // Play spammable audio without cutting off previous plays
        function playSpammableDropSound() {
            const sound = new Audio('sources/tacobell1.mp3');
            sound.play().catch(err => console.log('Audio play error:', err));
        }

        function spawnNacho() {
            const img = document.createElement('img');
            img.src = 'images/nacho2.jpg';
            img.className = 'falling-nacho';
            
            // Random horizontal start position
            const startX = Math.random() * (window.innerWidth - 160);
            const startY = -180;
            // Land randomly across the lower/middle section of the screen
            const targetY = window.innerHeight - 180 - (Math.random() * (window.innerHeight * 0.7));
            
            img.style.left = `${startX}px`;
            img.style.top = `${startY}px`;
            
            document.body.appendChild(img);

            const nachoObj = {
                element: img,
                x: startX,
                y: startY,
                targetY: targetY,
                speed: 12 + Math.random() * 10,
                rotation: (Math.random() - 0.5) * 60
            };

            fallingNachos.push(nachoObj);
        }

        function clearScreen() {
            soundClear.currentTime = 0;
            soundClear.play().catch(err => console.log('Audio play error:', err));
            
            fallingNachos.forEach(nacho => {
                if (nacho.element && nacho.element.parentNode) {
                    nacho.element.parentNode.removeChild(nacho.element);
                }
            });
            fallingNachos = [];
        }

        // Animation loop
        function updatePhysics() {
            fallingNachos.forEach(nacho => {
                if (nacho.y < nacho.targetY) {
                    nacho.y += nacho.speed;
                    if (nacho.y > nacho.targetY) nacho.y = nacho.targetY;
                    nacho.element.style.transform = `translateY(${nacho.y - (-180)}px) rotate(${nacho.rotation}deg)`;
                }
            });
            requestAnimationFrame(updatePhysics);
        }
        updatePhysics();

        function handleClick(e) {
            if (e.target.tagName === 'A') return;

            if (hint) hint.style.display = 'none';

            if (fallingNachos.length >= MAX_NACHOS) {
                clearScreen();
            } else {
                playSpammableDropSound();
                spawnNacho();
            }
        }

        document.body.addEventListener('pointerdown', handleClick);
    </script>
</body>
</html>
