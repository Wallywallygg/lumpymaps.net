<!DOCTYPE html>
<html lang="en">
<head>

    <title>Blog - Lumpymaps</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom font setup */
        @font-face {
            font-family: 'Overwave';
            src: url('./overwave.otf') format('opentype'),
                 url('./overwave.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: left;
            margin-bottom: 40px;
        }

        /* Title styling */
        header h1 {
            font-family: 'Overwave', Impact, sans-serif;
            font-size: clamp(3.5rem, 12vw, 7.5rem);
            line-height: 0.9;
            margin: 0 0 15px 0;
            letter-spacing: -2px;
        }

        header h1 a {
            color: #000000;
            text-decoration: none;
        }

        /* Navigation menu */
        header nav, 
        header nav a {
            font-family: Arial, sans-serif;
            font-size: 1.1rem;
            color: #000000;
            text-decoration: none;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        /* Blog post list styling */
        main h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .blog-list {
            list-style-type: square;
            padding-left: 20px;
            line-height: 2;
            font-size: 1.1rem;
        }

        .blog-list li strong {
            display: inline-block;
            min-width: 120px;
        }

        .blog-list a {
            color: #000000;
            text-decoration: underline;
        }

        .blog-list a:hover {
            color: #555555;
        }
    </style>
</head>
