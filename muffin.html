---
layout: lumpycat
title: Muffin
---

<style>
    body {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        overflow: hidden;
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .content {
        text-align: center;
        margin: auto;
        position: relative;
        z-index: 100;
    }
    .content img {
        max-width: 80vw;
        max-height: 60vh;
        border-radius: 8px;
        display: block;
        margin: 0 auto 20px auto;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        user-select: none;
        cursor: pointer;
        transition: transform 0.15s ease;
    }
    /* Stretch effect when middle picture is clicked */
    .content img.stretched {
        transform: scaleX(1.3) scaleY(0.85);
    }

    /* Muffin Fat Text Wave Styling */
    .fat-text-container {
        font-size: 1.8rem;
        font-weight: bold;
        color: #ffffff;
        margin: 10px 0;
        cursor: pointer;
        display: inline-block;
    }
    .wave-letter {
        display: inline-block;
        transition: transform 0.05s linear;
    }
</style>

<div class="content">
    <img id="muffin-img" src="{{ 'images/muffin.jpg' | relative_url }}" alt="Muffin the cat">
    <p>muffin so <span id="faaat-text" class="fat-text-container">fat</span></p> <br>
</div>

<!-- 5 Random Squish Sound Elements -->
<audio id="squish-1" src="{{ 'sources/squish1.wav' | relative_url }}" preload="auto"></audio>
<audio id="squish-2" src="{{ 'sources/squish2.wav' | relative_url }}" preload="auto"></audio>
<audio id="squish-3" src="{{ 'sources/squish3.wav' | relative_url }}" preload="auto"></audio>
<audio id="squish-4" src="{{ 'sources/squish4.wav' | relative_url }}" preload="auto"></audio>
<audio id="squish-5" src="{{ 'sources/squish5.wav' | relative_url }}" preload="auto"></audio>

<script>
    const muffinImg = document.getElementById('muffin-img');
    const fatTextContainer = document.getElementById('faaat-text');
    
    let aCount = 1; // Tracks how many 'a's are currently in f[a...]t
    let currentAnimSpeedMultiplier = 1; // Speeds up when clicked faster
    let animationId = null;
    let startTime = null;

    // Picture click stretch effect
    muffinImg.addEventListener('click', (e) => {
        e.stopPropagation();
        muffinImg.classList.add('stretched');
        setTimeout(() => {
            muffinImg.classList.remove('stretched');
        }, 150);
    });

    // Rebuild text structure dynamically: "f" + "a" repeated aCount times + "t"
    function updateTextString() {
        fatTextContainer.innerHTML = '';
        let currentWord = 'f' + 'a'.repeat(aCount) + 't';
        
        for (let char of currentWord) {
            const span = document.createElement('span');
            span.textContent = char;
            span.className = 'wave-letter';
            fatTextContainer.appendChild(span);
        }
    }
    updateTextString();

    // Play one of 5 random squish sounds
    function playRandomSquishSound() {
        const randomIndex = Math.floor(Math.random() * 5) + 1;
        const sound = document.getElementById(`squish-${randomIndex}`);
        if (sound) {
            sound.currentTime = 0;
            sound.play().catch(err => console.log('Audio play error:', err));
        }
    }

    // Interactive wave animation that adapts its speed dynamically
    function triggerWave() {
        playRandomSquishSound();

        // If clicked while animating, speed up the multiplier (capped at 3x speed max)
        if (animationId) {
            currentAnimSpeedMultiplier = Math.min(currentAnimSpeedMultiplier + 0.6, 3.0);
            cancelAnimationFrame(animationId);
        } else {
            currentAnimSpeedMultiplier = 1.0;
            // Add an extra 'a' right before the final 't' on click
            aCount++;
            updateTextString();
        }

        const letters = fatTextContainer.querySelectorAll('.wave-letter');
        const totalDuration = 600; // Base duration of the full wave in ms
        startTime = performance.now();

        function animateWave(currentTime) {
            let elapsed = (currentTime - startTime) * currentAnimSpeedMultiplier;
            let progress = elapsed / totalDuration;

            if (progress < 1) {
                letters.forEach((letter, index) => {
                    // Stagger each letter's sine wave phase
                    let phaseOffset = index * 0.4;
                    let translateY = -Math.sin((progress * Math.PI * 2) - phaseOffset) * 18;
                    // Only wave if the wave cycle is active for this phase
                    if (progress * Math.PI * 2 - phaseOffset >= 0 && progress * Math.PI * 2 - phaseOffset <= Math.PI * 2) {
                        letter.style.transform = `translateY(${translateY}px)`;
                    } else {
                        letter.style.transform = `translateY(0px)`;
                    }
                });
                animationId = requestAnimationFrame(animateWave);
            } else {
                // Reset positions and reset speed multiplier cooldown
                letters.forEach(letter => letter.style.transform = `translateY(0px)`);
                animationId = null;
                currentAnimSpeedMultiplier = 1.0;
            }
        }

        animationId = requestAnimationFrame(animateWave);
    }

    fatTextContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerWave();
    });
</script>
