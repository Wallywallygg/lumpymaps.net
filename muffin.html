---
layout: lumpycat
title: Muffin
---

<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        overflow: hidden;
    }
    body {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        touch-action: manipulation;
    }
    .content {
        text-align: center;
        margin: auto;
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 0 15px; /* Adds a safety margin from browser edges */
    }
    .content img {
        max-width: 75vw;
        max-height: 55vh;
        border-radius: 8px;
        display: block;
        margin: 0 auto 20px auto;
        will-change: transform;
        transform-origin: center center;
        -webkit-transform-origin: center center;
    }
    
    /* Muffin Fat Text Wave Container */
    .title-subtext {
        font-size: 1.6rem;
        font-weight: bold;
        margin: 5px 0;
        display: inline-block;
        cursor: pointer;
        white-space: pre; /* Preserves spaces properly */
        max-width: calc(100vw - 3ch); /* Caps text width ~1 character away from screen edge */
        overflow: hidden;
        text-overflow: clip;
    }
    .wave-char {
        display: inline-block;
        will-change: transform;
    }

    .house-of-lumpy {
        color: #0000FF !important;
        text-decoration: none;
    }
    .house-of-lumpy:hover {
        text-decoration: underline;
    }

    /* Controlled Spring Stretch & Wiggle Keyframes */
    .anim-stretch-horizontal {
        -webkit-animation: springHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: springHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .anim-stretch-vertical {
        -webkit-animation: springVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: springVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @-webkit-keyframes springHoriz {

        60%  { -webkit-transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); }
