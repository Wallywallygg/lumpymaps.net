---
layout: lumpycat
title: Muffin
---

<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        overflow: hidden;
    }
    body {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        touch-action: manipulation;
    }
    .content {
        text-align: center;
        margin: auto;
        position: relative;
        z-index: 1;
        width: 100%;
    }
    .content img {
        max-width: 75vw;
        max-height: 55vh;
        border-radius: 8px;
        display: block;
        margin: 0 auto 20px auto;
        will-change: transform;
        transform-origin: center center;
        -webkit-transform-origin: center center;
    }
    
    /* Muffin Fat Text Wave Container */
    .title-subtext {
        font-size: 1.6rem;
        font-weight: bold;
        margin: 5px 0;
        display: inline-block;
        cursor: pointer;
        white-space: pre; /* Preserves spaces properly */
    }
    .wave-char {
        display: inline-block;
        will-change: transform;
    }

    .house-of-lumpy {
        color: #0000FF !important;
        text-decoration: none;
    }
    .house-of-lumpy:hover {
        text-decoration: underline;
    }

    /* Controlled Spring Stretch & Wiggle Keyframes */
    .anim-stretch-horizontal {
        -webkit-animation: springHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: springHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .anim-stretch-vertical {
        -webkit-animation: springVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: springVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @-webkit-keyframes springHoriz {
        0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        20%  { -webkit-transform: scale(calc(1 + 0.35 * var(--intensity)), calc(1 - 0.25 * var(--intensity))) rotate(calc(-6deg * var(--intensity))); transform: scale(calc(1 + 0.35 * var(--intensity)), calc(1 - 0.25 * var(--intensity))) rotate(calc(-6deg * var(--intensity))); }
        40%  { -webkit-transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(calc(5deg * var(--intensity))); transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(calc(5deg * var(--intensity))); }
        60%  { -webkit-transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); }
        80%  { -webkit-transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(calc(1deg * var(--intensity))); transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(calc(1deg * var(--intensity))); }
        100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
    }

    @keyframes springHoriz {
        0%   { transform: scale(1, 1) rotate(0deg); }
        20%  { transform: scale(calc(1 + 0.35 * var(--intensity)), calc(1 - 0.25 * var(--intensity))) rotate(calc(-6deg * var(--intensity))); }
        40%  { transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(calc(5deg * var(--intensity))); }
        60%  { transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); }
        80%  { transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(calc(1deg * var(--intensity))); }
        100% { transform: scale(1, 1) rotate(0deg); }
    }

    @-webkit-keyframes springVert {
        0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        20%  { -webkit-transform: scale(calc(1 - 0.25 * var(--intensity)), calc(1 + 0.35 * var(--intensity))) rotate(calc(6deg * var(--intensity))); transform: scale(calc(1 - 0.25 * var(--intensity)), calc(1 + 0.35 * var(--intensity))) rotate(calc(6deg * var(--intensity))); }
        40%  { -webkit-transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(calc(-5deg * var(--intensity))); transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(calc(-5deg * var(--intensity))); }
        60%  { -webkit-transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.12 * var(--intensity))) rotate(calc(3deg * var(--intensity))); transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.12 * var(--intensity))) rotate(calc(3deg * var(--intensity))); }
        80%  { -webkit-transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(calc(-1deg * var(--intensity))); transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(calc(-1deg * var(--intensity))); }
        100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
    }

    @keyframes springVert {
        0%   { transform: scale(1, 1) rotate(0deg); }
        20%  { transform: scale(calc(1 - 0.25 * var(--intensity)), calc(1 + 0.35 * var(--intensity))) rotate(calc(6deg * var(--intensity))); }
        40%  { transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(calc(-5deg * var(--intensity))); }
        60%  { transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.12 * var(--intensity))) rotate(calc(3deg * var(--intensity))); }
        80%  { transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(calc(-1deg * var(--intensity))); }
        100% { transform: scale(1, 1) rotate(0deg); }
    }
</style>

<div class="content">
    <img id="muffin-img" src="{{ '/images/muffin.jpg' | relative_url }}" alt="Muffin">
    <p id="subtext-container" class="title-subtext">Muffin so fat</p>
</div>

<!-- Hidden audio elements for splat1.wav - splat5.wav -->
<audio id="splat-1" src="{{ '/sources/splat1.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-2" src="{{ '/sources/splat2.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-3" src="{{ '/sources/splat3.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-4" src="{{ '/sources/splat4.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-5" src="{{ '/sources/splat5.wav' | relative_url }}" preload="auto"></audio>

<script>
    const muffinImg = document.getElementById('muffin-img');
    const subtextContainer = document.getElementById('subtext-container');

    let htmlAudioElements = [];
    let lastSplatIndex = -1;

    let clickIntensity = 1.0;
    let lastClickTime = 0;

    for (let i = 1; i <= 5; i++) {
        const audioEl = document.getElementById(`splat-${i}`);
        if (audioEl) {
            htmlAudioElements.push(audioEl);
        }
    }

    function playRandomSplat() {
        if (htmlAudioElements.length === 0) return;
        let index;
        do {
            index = Math.floor(Math.random() * htmlAudioElements.length);
        } while (index === lastSplatIndex && htmlAudioElements.length > 1);
        lastSplatIndex = index;

        const sound = htmlAudioElements[index];
        sound.currentTime = 0;
        sound.play().catch(err => console.log('Audio play error:', err));
    }

    // Wrap each character (including spaces) into a span
    function initTextSpans() {
        const text = subtextContainer.textContent;
        subtextContainer.innerHTML = '';
        for (let char of text) {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === ' ') {
                span.style.display = 'inline-block';
                span.style.width = '0.3em';
            } else {
                span.className = 'wave-char';
            }
            subtextContainer.appendChild(span);
        }
    }
    initTextSpans();

    let isWaveRunning = false;
    let waveProgress = 1.0; 
    let waveSpeed = 0.035;

    function triggerTextWave() {
        const currentSpans = subtextContainer.querySelectorAll('span');
        let currentText = Array.from(currentSpans).map(span => span.textContent).join('');
        
        const tMatchIndex = currentText.lastIndexOf('t');
        if (tMatchIndex !== -1) {
            currentText = currentText.slice(0, tMatchIndex) + 'a' + currentText.slice(tMatchIndex);
        } else {
            currentText += 'a';
        }

        subtextContainer.innerHTML = '';
        for (let char of currentText) {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === ' ') {
                span.style.display = 'inline-block';
                span.style.width = '0.3em';
            } else {
                span.className = 'wave-char';
            }
            subtextContainer.appendChild(span);
        }

        if (isWaveRunning) {
            waveSpeed = Math.min(waveSpeed + 0.04, 0.18);
        } else {
            waveSpeed = 0.035;
            waveProgress = 0.0;
            isWaveRunning = true;
            requestAnimationFrame(animateWave);
        }
    }

    function animateWave() {
        const chars = subtextContainer.querySelectorAll('.wave-char');
        const waveWidth = 2.5; 

        let allFinished = true;
        chars.forEach((char, i) => {
            const charProgress = waveProgress - (i * 0.18);
            if (charProgress >= 0 && charProgress <= waveWidth) {
                allFinished = false;
                const translateY = -Math.sin((charProgress / waveWidth) * Math.PI) * 14;
                char.style.transform = `translateY(${translateY}px)`;
            } else {
                char.style.transform = `translateY(0px)`;
            }
        });

        waveProgress += waveSpeed;

        if (!allFinished || waveProgress < 1.0) {
            requestAnimationFrame(animateWave);
        } else {
            chars.forEach(char => char.style.transform = `translateY(0px)`);
            isWaveRunning = false;
        }
    }

    // Handles progressive scaling intensity on spam clicks
    function handleInteraction() {
        playRandomSplat();

        const now = performance.now();
        // If clicked rapidly within 400ms, increase intensity; otherwise reset to light poke
        if (now - lastClickTime < 400) {
            clickIntensity = Math.min(clickIntensity + 0.45, 4.0);
        } else {
            clickIntensity = 1.0;
        }
        lastClickTime = now;

        const animClass = Math.random() < 0.5 ? 'anim-stretch-horizontal' : 'anim-stretch-vertical';
        muffinImg.style.setProperty('--intensity', clickIntensity);
        muffinImg.classList.remove('anim-stretch-horizontal', 'anim-stretch-vertical');
        void muffinImg.offsetWidth;
        muffinImg.classList.add(animClass);
    }

    // Muffin Picture Click
    muffinImg.addEventListener('click', (e) => {
        e.stopPropagation();
        handleInteraction();
    });

    // Text Click (Also triggers wave)
    subtextContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerTextWave();
        handleInteraction();
    });

    muffinImg.addEventListener('animationend', () => {
        muffinImg.classList.remove('anim-stretch-horizontal', 'anim-stretch-vertical');
    });

    // Background Click
    document.body.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A' && e.target !== muffinImg && e.target !== subtextContainer && !subtextContainer.contains(e.target)) {
            handleInteraction();
        }
    });
</script>
