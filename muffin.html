---
layout: lumpycat
title: Muffin
---

<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        overflow-x: hidden;
    }
    body {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        touch-action: manipulation;
    }
    .content {
        text-align: center;
        margin: auto;
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 0 15px;
    }
    .content img {
        max-width: 75vw;
        max-height: 55vh;
        border-radius: 8px;
        display: block;
        margin: 0 auto 20px auto;
        will-change: transform;
        transform-origin: center center;
        -webkit-transform-origin: center center;
    }
    
    /* Muffin Fat Text Wave Container - Added vertical padding to prevent top clipping */
    .title-subtext {
        font-size: 1.6rem;
        font-weight: bold;
        margin: 10px 0;
        display: inline-block;
        cursor: pointer;
        white-space: pre; /* Preserves spaces properly */
        padding: 12px 0; /* Room for translateY(-14px) wave jump */
    }
    .wave-char {
        display: inline-block;
        will-change: transform;
    }

    .house-of-lumpy {
        color: #0000FF !important;
        text-decoration: none;
    }
    .house-of-lumpy:hover {
        text-decoration: underline;
    }

    /* Jello Jello Jiggle Keyframes: Horizontal Squish vs Vertical Stretch */
    .anim-jello-horiz {
        -webkit-animation: jelloHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: jelloHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .anim-jello-vert {
        -webkit-animation: jelloVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: jelloVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @-webkit-keyframes jelloHoriz {
        0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        20%  { -webkit-transform: scale(calc(1 + 0.22 * var(--intensity)), calc(1 - 0.18 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); transform: scale(calc(1 + 0.22 * var(--intensity)), calc(1 - 0.18 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); }
        40%  { -webkit-transform: scale(calc(1 - 0.15 * var(--intensity)), calc(1 + 0.15 * var(--intensity))) rotate(calc(2.5deg * var(--intensity))); transform: scale(calc(1 - 0.15 * var(--intensity)), calc(1 + 0.15 * var(--intensity))) rotate(calc(2.5deg * var(--intensity))); }
        60%  { -webkit-transform: scale(calc(1 + 0.08 * var(--intensity)), calc(1 - 0.08 * var(--intensity))) rotate(calc(-1.5deg * var(--intensity))); transform: scale(calc(1 + 0.08 * var(--intensity)), calc(1 - 0.08 * var(--intensity))) rotate(calc(-1.5deg * var(--intensity))); }
        80%  { -webkit-transform: scale(calc(1 - 0.03 * var(--intensity)), calc(1 + 0.03 * var(--intensity))) rotate(calc(0.5deg * var(--intensity))); transform: scale(calc(1 - 0.03 * var(--intensity)), calc(1 + 0.03 * var(--intensity))) rotate(calc(0.5deg * var(--intensity))); }
        100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
    }

    @keyframes jelloHoriz {
        0%   { transform: scale(1, 1) rotate(0deg); }
        20%  { transform: scale(calc(1 + 0.22 * var(--intensity)), calc(1 - 0.18 * var(--intensity))) rotate(calc(-3deg * var(--intensity))); }
        40%  { transform: scale(calc(1 - 0.15 * var(--intensity)), calc(1 + 0.15 * var(--intensity))) rotate(calc(2.5deg * var(--intensity))); }
        60%  { transform: scale(calc(1 + 0.08 * var(--intensity)), calc(1 - 0.08 * var(--intensity))) rotate(calc(-1.5deg * var(--intensity))); }
        80%  { transform: scale(calc(1 - 0.03 * var(--intensity)), calc(1 + 0.03 * var(--intensity))) rotate(calc(0.5deg * var(--intensity))); }
        100% { transform: scale(1, 1) rotate(0deg); }
    }

    @-webkit-keyframes jelloVert {
        0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        20%  { -webkit-transform: scale(calc(1 - 0.18 * var(--intensity)), calc(1 + 0.22 * var(--intensity))) rotate(calc(3deg * var(--intensity))); transform: scale(calc(1 - 0.18 * var(--intensity)), calc(1 + 0.22 * var(--intensity))) rotate(calc(3deg * var(--intensity))); }
        40%  { -webkit-transform: scale(calc(1 + 0.15 * var(--intensity)), calc(1 - 0.15 * var(--intensity))) rotate(calc(-2.5deg * var(--intensity))); transform: scale(calc(1 + 0.15 * var(--intensity)), calc(1 - 0.15 * var(--intensity))) rotate(calc(-2.5deg * var(--intensity))); }
        60%  { -webkit-transform: scale(calc(1 - 0.08 * var(--intensity)), calc(1 + 0.08 * var(--intensity))) rotate(calc(1.5deg * var(--intensity))); transform: scale(calc(1 - 0.08 * var(--intensity)), calc(1 + 0.08 * var(--intensity))) rotate(calc(1.5deg * var(--intensity))); }
        80%  { -webkit-transform: scale(calc(1 + 0.03 * var(--intensity)), calc(1 - 0.03 * var(--intensity))) rotate(calc(-0.5deg * var(--intensity))); transform: scale(calc(1 + 0.03 * var(--intensity)), calc(1 - 0.03 * var(--intensity))) rotate(calc(-0.5deg * var(--intensity))); }
        100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
    }

    @keyframes jelloVert {
        0%   { transform: scale(1, 1) rotate(0deg); }
        20%  { transform: scale(calc(1 - 0.18 * var(--intensity)), calc(1 + 0.22 * var(--intensity))) rotate(calc(3deg * var(--intensity))); }
        40%  { transform: scale(calc(1 + 0.15 * var(--intensity)), calc(1 - 0.15 * var(--intensity))) rotate(calc(-2.5deg * var(--intensity))); }
        60%  { transform: scale(calc(1 - 0.08 * var(--intensity)), calc(1 + 0.08 * var(--intensity))) rotate(calc(1.5deg * var(--intensity))); }
        80%  { transform: scale(calc(1 + 0.03 * var(--intensity)), calc(1 - 0.03 * var(--intensity))) rotate(calc(-0.5deg * var(--intensity))); }
        100% { transform: scale(1, 1) rotate(0deg); }
    }
</style>

<div class="content">
    <img id="muffin-img" src="{{ '/images/muffin.jpg' | relative_url }}" alt="Muffin">
    <p id="subtext-container" class="title-subtext">Muffin so fat</p>
</div>

<!-- Audio Elements for Splat noises and Doink -->
<audio id="splat-1" src="{{ '/sources/splat1.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-2" src="{{ '/sources/splat2.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-3" src="{{ '/sources/splat3.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-4" src="{{ '/sources/splat4.wav' | relative_url }}" preload="auto"></audio>
<audio id="splat-5" src="{{ '/sources/splat5.wav' | relative_url }}" preload="auto"></audio>
<audio id="doink-sound" src="{{ '/sources/doink.mp3' | relative_url }}" preload="auto"></audio>

<script>
    const muffinImg = document.getElementById('muffin-img');
    const subtextContainer = document.getElementById('subtext-container');
    const doinkSound = document.getElementById('doink-sound');

    let htmlAudioElements = [];
    let lastSplatIndex = -1;

    let clickIntensity = 1.0;
    let lastClickTime = 0;

    for (let i = 1; i <= 5; i++) {
        const audioEl = document.getElementById(`splat-${i}`);
        if (audioEl) {
            htmlAudioElements.push(audioEl);
        }
    }

    // Strictly ensures the same splat sound never plays twice in a row
    function playRandomSplat() {
        if (htmlAudioElements.length === 0) return;
        let index;
        do {
            index = Math.floor(Math.random() * htmlAudioElements.length);
        } while (index === lastSplatIndex);
        lastSplatIndex = index;

        const sound = htmlAudioElements[index];
        sound.currentTime = 0;
        sound.play().catch(err => console.log('Audio play error:', err));
    }

    // Dedicated function to play doink.mp3 for text clicks
    function playDoinkSound() {
        if (doinkSound) {
            doinkSound.currentTime = 0;
            doinkSound.play().catch(err => console.log('Audio play error:', err));
        }
    }

    // Wrap each character (including spaces) into a span
    function initTextSpans() {
        const text = subtextContainer.textContent;
        subtextContainer.innerHTML = '';
        for (let char of text) {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === ' ') {
                span.style.display = 'inline-block';
                span.style.width = '0.3em';
            } else {
                span.className = 'wave-char';
            }
            subtextContainer.appendChild(span);
        }
    }
    initTextSpans();

    let isWaveRunning = false;
    let waveProgress = 1.0; 
    let waveSpeed = 0.055;

    function triggerTextWave() {
        playDoinkSound(); // Play doink when text is clicked

        const currentSpans = subtextContainer.querySelectorAll('span');
        let currentText = Array.from(currentSpans).map(span => span.textContent).join('');
        
        // Safety boundary check: stop adding 'a' when within 60px of screen boundary
        const safetyMargin = 60;
        if (subtextContainer.getBoundingClientRect().width < window.innerWidth - safetyMargin) {
            const tMatchIndex = currentText.lastIndexOf('t');
            if (tMatchIndex !== -1) {
                currentText = currentText.slice(0, tMatchIndex) + 'a' + currentText.slice(tMatchIndex);
            } else {
                currentText += 'a';
            }
        }

        subtextContainer.innerHTML = '';
        for (let char of currentText) {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === ' ') {
                span.style.display = 'inline-block';
                span.style.width = '0.3em';
            } else {
                span.className = 'wave-char';
            }
            subtextContainer.appendChild(span);
        }

        if (isWaveRunning) {
            waveSpeed = Math.min(waveSpeed + 0.05, 0.22);
        } else {
            waveSpeed = 0.055;
            waveProgress = 0.0;
            isWaveRunning = true;
            requestAnimationFrame(animateWave);
        }
    }

    function animateWave() {
        const chars = subtextContainer.querySelectorAll('.wave-char');
        const waveWidth = 1.6; 

        let allFinished = true;
        chars.forEach((char, i) => {
            const charProgress = waveProgress - (i * 0.12);
            if (charProgress >= 0 && charProgress <= waveWidth) {
                allFinished = false;
                const translateY = -Math.sin((charProgress / waveWidth) * Math.PI) * 14;
                char.style.transform = `translateY(${translateY}px)`;
            } else {
                char.style.transform = `translateY(0px)`;
            }
        });

        waveProgress += waveSpeed;

        if (!allFinished || waveProgress < 1.0) {
            requestAnimationFrame(animateWave);
        } else {
            chars.forEach(char => char.style.transform = `translateY(0px)`);
            isWaveRunning = false;
        }
    }

    // Handles progressive scaling intensity on spam clicks with randomized jello direction
    function handlePictureInteraction() {
        playRandomSplat();

        const now = performance.now();
        if (now - lastClickTime < 400) {
            clickIntensity = Math.min(clickIntensity + 0.2, 1.8);
        } else {
            clickIntensity = 1.0;
        }
        lastClickTime = now;

        // Randomly pick horizontal squish or vertical stretch like jello
        const animClass = Math.random() < 0.5 ? 'anim-jello-horiz' : 'anim-jello-vert';
        muffinImg.style.setProperty('--intensity', clickIntensity);
        muffinImg.classList.remove('anim-jello-horiz', 'anim-jello-vert');
        void muffinImg.offsetWidth;
        muffinImg.classList.add(animClass);
    }

    // Muffin Picture Click (Stretches picture only)
    muffinImg.addEventListener('click', (e) => {
        e.stopPropagation();
        handlePictureInteraction();
    });

    // Text Click (Triggers wave and doink sound only, does not jiggle picture)
    subtextContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerTextWave();
    });

    muffinImg.addEventListener('animationend', () => {
        muffinImg.classList.remove('anim-jello-horiz', 'anim-jello-vert');
    });

    // Background Click
    document.body.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A' && e.target !== muffinImg && e.target !== subtextContainer && !subtextContainer.contains(e.target)) {
            handlePictureInteraction();
        }
    });
</script>
