<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muffin</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            position: relative;
        }
        header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            position: relative;
            z-index: 10;
        }
        header nav, 
        header nav a {
            color: #ffffff;
            text-decoration: none;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        .content {
            text-align: center;
            margin: auto;
        }
        .content img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 8px;
            display: block;
            margin: 0 auto 20px auto;
            will-change: transform;
            transform-origin: center center;
            -webkit-transform-origin: center center;
        }
        .title-subtext {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 5px 0;
        }
        .house-of-lumpy {
            color: #0000FF !important;
            text-decoration: none;
        }
        .house-of-lumpy:hover {
            text-decoration: underline;
        }

        /* Spring Stretch & Wiggle Keyframes */
        .anim-stretch-horizontal {
            -webkit-animation: springHoriz 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: springHoriz 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .anim-stretch-vertical {
            -webkit-animation: springVert 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: springVert 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @-webkit-keyframes springHoriz {
            0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
            20%  { -webkit-transform: scale(calc(1 + 0.4 * var(--intensity)), calc(1 - 0.35 * var(--intensity))) rotate(-6deg); transform: scale(calc(1 + 0.4 * var(--intensity)), calc(1 - 0.35 * var(--intensity))) rotate(-6deg); }
            40%  { -webkit-transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(5deg); transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(5deg); }
            60%  { -webkit-transform: scale(calc(1 + 0.15 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(-3deg); transform: scale(calc(1 + 0.15 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(-3deg); }
            80%  { -webkit-transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(1deg); transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(1deg); }
            100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        }

        @keyframes springHoriz {
            0%   { transform: scale(1, 1) rotate(0deg); }
            20%  { transform: scale(calc(1 + 0.4 * var(--intensity)), calc(1 - 0.35 * var(--intensity))) rotate(-6deg); }
            40%  { transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(5deg); }
            60%  { transform: scale(calc(1 + 0.15 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(-3deg); }
            80%  { transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(1deg); }
            100% { transform: scale(1, 1) rotate(0deg); }
        }

        @-webkit-keyframes springVert {
            0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
            20%  { -webkit-transform: scale(calc(1 - 0.35 * var(--intensity)), calc(1 + 0.4 * var(--intensity))) rotate(6deg); transform: scale(calc(1 - 0.35 * var(--intensity)), calc(1 + 0.4 * var(--intensity))) rotate(6deg); }
            40%  { -webkit-transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(-5deg); transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(-5deg); }
            60%  { -webkit-transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.15 * var(--intensity))) rotate(3deg); transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.15 * var(--intensity))) rotate(3deg); }
            80%  { -webkit-transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(-1deg); transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(-1deg); }
            100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        }

        @keyframes springVert {
            0%   { transform: scale(1, 1) rotate(0deg); }
            20%  { transform: scale(calc(1 - 0.35 * var(--intensity)), calc(1 + 0.4 * var(--intensity))) rotate(6deg); }
            40%  { transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(-5deg); }
            60%  { transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.15 * var(--intensity))) rotate(3deg); }
            80%  { transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(-1deg); }
            100% { transform: scale(1, 1) rotate(0deg); }
        }
    </style>
</head>
<body>
    <header>
        <nav style="font-size: 1.1rem;">
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="sources/GISPortfolio.pdf">GIS Portfolio</a> |
            <a href="projects.html">Projects</a> |
            <a href="lumpy.html">Lumpy</a> |
            <a href="muffin.html">Muffin</a> |
            <a href="NACHO.html" id="nacho-link">Nacho</a>
        </nav>
    </header>

    <div class="content">
        <img id="muffin-img" src="images/muffin.jpg" alt="Muffin">
        <p class="title-subtext">Muffin so faaaaatttttt</p>
    </div>

    <script>
        const muffinImg = document.getElementById('muffin-img');

        // Multi-tier audio playback engine (Web Audio API + HTML5 Audio fallback)
        let audioCtx = null;
        const splatBuffers = [];
        const htmlAudioPool = [];
        let lastSplatIndex = -1;

        // Click intensity/velocity tracking
        let clickIntensity = 1.0;
        let lastClickTime = 0;
        const maxIntensity = 3.5; // Upper limit multiplier for huge stretches
        const intensityDecay = 0.85;

        for (let i = 1; i <= 5; i++) {
            const el = new Audio(`sources/splat${i}.wav`);
            el.preload = 'auto';
            htmlAudioPool.push(el);
        }

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audioCtx && splatBuffers.length === 0) {
                for (let i = 1; i <= 5; i++) {
                    fetch(`sources/splat${i}.wav`)
                        .then(response => response.arrayBuffer())
                        .then(data => audioCtx.decodeAudioData(data))
                        .then(buffer => {
                            splatBuffers[i - 1] = buffer;
                        })
                        .catch(() => {});
                }
            }
        }

        function playRandomSplat() {
            const availableIndices = [];
            for (let i = 0; i < 5; i++) {
                if (i !== lastSplatIndex) {
                    availableIndices.push(i);
                }
            }

            const selectedIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            lastSplatIndex = selectedIndex;

            if (audioCtx && splatBuffers[selectedIndex]) {
                try {
                    const source = audioCtx.createBufferSource();
                    source.buffer = splatBuffers[selectedIndex];
                    source.connect(audioCtx.destination);
                    source.start(0);
                    return;
                } catch (err) {}
            }

            try {
                const audioEl = htmlAudioPool[selectedIndex].cloneNode(true);
                audioEl.currentTime = 0;
                audioEl.play().catch(() => {});
            } catch (err) {}
        }

        function updateClickIntensity() {
            const now = Date.now();
            const timeDelta = now - lastClickTime;
            lastClickTime = now;

            // Rapid clicking (under 400ms apart) boosts intensity factor
            if (timeDelta < 400) {
                const boost = (400 - timeDelta) / 200;
                clickIntensity = Math.min(maxIntensity, clickIntensity + boost);
            } else {
                clickIntensity = 1.0;
            }

            // Set dynamic CSS variable on image element
            muffinImg.style.setProperty('--intensity', clickIntensity.toFixed(2));
        }

        function triggerStretchAnimation() {
            muffinImg.classList.remove('anim-stretch-horizontal', 'anim-stretch-vertical');
            void muffinImg.offsetWidth; // Force CSS reflow restart

            const animClass = Math.random() < 0.5 ? 'anim-stretch-horizontal' : 'anim-stretch-vertical';
            muffinImg.classList.add(animClass);
        }

        let isProcessingAction = false;

        function handleAction(e) {
            if (e.target && e.target.tagName === 'A') return;

            if (isProcessingAction) return;
            isProcessingAction = true;
            setTimeout(() => { isProcessingAction = false; }, 30);

            initAudioContext();
            updateClickIntensity();
            playRandomSplat();
            triggerStretchAnimation();
        }

        if (window.PointerEvent) {
            document.body.addEventListener('pointerdown', handleAction, { passive: true });
        } else {
            document.body.addEventListener('touchstart', handleAction, { passive: true });
            document.body.addEventListener('mousedown', handleAction, { passive: true });
        }
    </script>
</body>
</html>
