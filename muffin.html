---
layout: lumpycat
title: Muffin
---

<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        overflow: hidden;
    }
    body {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        touch-action: manipulation;
    }
    .content {
        text-align: center;
        margin: auto;
        position: relative;
        z-index: 1;
        width: 100%;
    }
    .content img {
        max-width: 75vw;
        max-height: 55vh;
        border-radius: 8px;
        display: block;
        margin: 0 auto 20px auto;
        will-change: transform;
        transform-origin: center center;
        -webkit-transform-origin: center center;
    }
    
    /* Muffin Fat Text Wave Container */
    .title-subtext {
        font-size: 1.6rem;
        font-weight: bold;
        margin: 5px 0;
        display: inline-block;
        cursor: pointer;
    }
    .wave-char {
        display: inline-block;
        will-change: transform;
    }

    .house-of-lumpy {
        color: #0000FF !important;
        text-decoration: none;
    }
    .house-of-lumpy:hover {
        text-decoration: underline;
    }

    /* Controlled Spring Stretch & Wiggle Keyframes */
    .anim-stretch-horizontal {
        -webkit-animation: springHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: springHoriz 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .anim-stretch-vertical {
        -webkit-animation: springVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: springVert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @-webkit-keyframes springHoriz {
        0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        20%  { -webkit-transform: scale(calc(1 + 0.35 * var(--intensity)), calc(1 - 0.25 * var(--intensity))) rotate(-6deg); transform: scale(calc(1 + 0.35 * var(--intensity)), calc(1 - 0.25 * var(--intensity))) rotate(-6deg); }
        40%  { -webkit-transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(5deg); transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(5deg); }
        60%  { -webkit-transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(-3deg); transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(-3deg); }
        80%  { -webkit-transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(1deg); transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(1deg); }
        100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
    }

    @keyframes springHoriz {
        0%   { transform: scale(1, 1) rotate(0deg); }
        20%  { transform: scale(calc(1 + 0.35 * var(--intensity)), calc(1 - 0.25 * var(--intensity))) rotate(-6deg); }
        40%  { transform: scale(calc(1 - 0.2 * var(--intensity)), calc(1 + 0.25 * var(--intensity))) rotate(5deg); }
        60%  { transform: scale(calc(1 + 0.12 * var(--intensity)), calc(1 - 0.1 * var(--intensity))) rotate(-3deg); }
        80%  { transform: scale(calc(1 - 0.05 * var(--intensity)), calc(1 + 0.05 * var(--intensity))) rotate(1deg); }
        100% { transform: scale(1, 1) rotate(0deg); }
    }

    @-webkit-keyframes springVert {
        0%   { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
        20%  { -webkit-transform: scale(calc(1 - 0.25 * var(--intensity)), calc(1 + 0.35 * var(--intensity))) rotate(6deg); transform: scale(calc(1 - 0.25 * var(--intensity)), calc(1 + 0.35 * var(--intensity))) rotate(6deg); }
        40%  { -webkit-transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(-5deg); transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(-5deg); }
        60%  { -webkit-transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.12 * var(--intensity))) rotate(3deg); transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.12 * var(--intensity))) rotate(3deg); }
        80%  { -webkit-transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(-1deg); transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(-1deg); }
        100% { -webkit-transform: scale(1, 1) rotate(0deg); transform: scale(1, 1) rotate(0deg); }
    }

    @keyframes springVert {
        0%   { transform: scale(1, 1) rotate(0deg); }
        20%  { transform: scale(calc(1 - 0.25 * var(--intensity)), calc(1 + 0.35 * var(--intensity))) rotate(6deg); }
        40%  { transform: scale(calc(1 + 0.25 * var(--intensity)), calc(1 - 0.2 * var(--intensity))) rotate(-5deg); }
        60%  { transform: scale(calc(1 - 0.1 * var(--intensity)), calc(1 + 0.12 * var(--intensity))) rotate(3deg); }
        80%  { transform: scale(calc(1 + 0.05 * var(--intensity)), calc(1 - 0.05 * var(--intensity))) rotate(-1deg); }
        100% { transform: scale(1, 1) rotate(0deg); }
    }
</style>

<div class="content">
    <img id="muffin-img" src="{{ '/images/muffin.jpg' | relative_url }}" alt="Muffin">
    <p id="subtext-container" class="title-subtext">Muffin so faaaaatttttt</p>
</div>

<script>
    const muffinImg = document.getElementById('muffin-img');
    const subtextContainer = document.getElementById('subtext-container');

    let audioCtx = null;
    const splatBuffers = [];
    const htmlAudioElements = [];
    let lastSplatIndex = -1;
    let isAudioUnlocked = false;

    let clickIntensity = 1.0;
    let lastClickTime = 0;

    // Preload audio files (squish1.wav to squish5.wav)
    for (let i = 1; i <= 5; i++) {
        const audioPath = '{{ "/sources/squish" | relative_url }}' + i + '.wav';
        const htmlAudio = new Audio(audioPath);
        htmlAudio.preload = 'auto';
        htmlAudioElements.push(htmlAudio);
    }

    function unlockAudio() {
        if (isAudioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioUnlocked = true;
        } catch(e) {
            console.log('Web Audio API not supported');
        }
    }

    function playRandomSplat() {
        unlockAudio();
        let index;
        do {
            index = Math.floor(Math.random() * htmlAudioElements.length);
        } while (index === lastSplatIndex && htmlAudioElements.length > 1);
        lastSplatIndex = index;

        const sound = htmlAudioElements[index];
        sound.currentTime = 0;
        sound.play().catch(err => console.log('Audio play error:', err));
    }

    // Wrap each character of the text in a span for wave manipulation
    function initTextSpans() {
        const text = subtextContainer.textContent;
        subtextContainer.innerHTML = '';
        for (let char of text) {
            const span = document.createElement('span');
            span.textContent = char;
            span.className = 'wave-char';
            subtextContainer.appendChild(span);
        }
    }
    initTextSpans();

    let isWaveRunning = false;
    let waveProgress = 1.0; // Starts completed so a fresh wave can trigger
    let waveSpeed = 0.035;  // Base speed

    function triggerTextWave() {
        // If clicked rapidly, boost wave speed and add an extra 'a' before the last 't'
        const now = performance.now();
        const timeDiff = now - lastClickTime;
        lastClickTime = now;

        if (timeDiff < 300) {
            waveSpeed = Math.min(waveSpeed + 0.015, 0.12);
        } else {
            waveSpeed = 0.035;
        }

        // Insert an 'a' right before the final sequence of 't's
        let currentHTML = subtextContainer.innerHTML;
        // Find position right before the trailing 't's
        const tMatchIndex = currentHTML.lastIndexOf('t');
        if (tMatchIndex !== -1) {
            subtextContainer.innerHTML = currentHTML.slice(0, tMatchIndex) + 'a' + currentHTML.slice(tMatchIndex);
        } else {
            subtextContainer.textContent += 'a';
        }

        // Restart wave animation cleanly
        waveProgress = 0.0;
        if (!isWaveRunning) {
            isWaveRunning = true;
            requestAnimationFrame(animateWave);
        }
    }

    function animateWave() {
        const chars = subtextContainer.querySelectorAll('.wave-char');
        const totalChars = chars.length;
        
        // Narrow wave configuration
        const waveWidth = 2.5; 

        let allFinished = true;
        chars.forEach((char, i) => {
            // Stagger each character's position along the wave
            const charProgress = waveProgress - (i * 0.18);
            if (charProgress >= 0 && charProgress <= waveWidth) {
                allFinished = false;
                // Narrow sine wave height hop (-14px peak)
                const translateY = -Math.sin((charProgress / waveWidth) * Math.PI) * 14;
                char.style.transform = `translateY(${translateY}px)`;
            } else {
                char.style.transform = `translateY(0px)`;
            }
        });

        waveProgress += waveSpeed;

        if (!allFinished || waveProgress < 1.0) {
            requestAnimationFrame(animateWave);
        } else {
            chars.forEach(char => char.style.transform = `translateY(0px)`);
            isWaveRunning = false;
        }
    }

    // Click handler for image and text
    function handleContentClick(e) {
        playRandomSplat();

        // Intensity scaling for image bounce
        const now = performance.now();
        if (now - lastClickTime < 400) {
            clickIntensity = Math.min(clickIntensity + 0.35, 2.8);
        } else {
            clickIntensity = 1.0;
        }

        // Trigger text wave & add 'a'
        triggerTextWave();

        // Animate image stretch
        const animClass = Math.random() < 0.5 ? 'anim-stretch-horizontal' : 'anim-stretch-vertical';
        muffinImg.style.setProperty('--intensity', clickIntensity);
        muffinImg.classList.remove('anim-stretch-horizontal', 'anim-stretch-vertical');
        void muffinImg.offsetWidth; // Trigger reflow
        muffinImg.classList.add(animClass);
    }

    muffinImg.addEventListener('click', (e) => {
        e.stopPropagation();
        handleContentClick(e);
    });

    subtextContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        handleContentClick(e);
    });

    muffinImg.addEventListener('animationend', () => {
        muffinImg.classList.remove('anim-stretch-horizontal', 'anim-stretch-vertical');
    });

    document.body.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A') {
            handleContentClick(e);
        }
    });
</script>
