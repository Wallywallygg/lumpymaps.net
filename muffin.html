---
layout: lumpycat
title: Muffin
---

<style>
    body {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        overflow: hidden;
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .content {
        text-align: center;
        margin: auto;
        position: relative;
        z-index: 100;
        pointer-events: none;
    }
    .content img {
        max-width: 80vw;
        max-height: 60vh;
        border-radius: 8px;
        display: block;
        margin: 0 auto 20px auto;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        user-select: none;
        pointer-events: auto;
    }
    .content p {
        font-size: 1.5rem;
        letter-spacing: 1px;
        margin: 0 0 4px 0;
        display: inline-block;
    }
    
    /* Muffin Fat Text Wave Styling */
    .fat-text-container {
        font-size: 1.8rem;
        font-weight: bold;
        color: #ffffff;
        margin: 10px 0;
        pointer-events: auto;
        cursor: pointer;
        display: inline-block;
    }
    .wave-letter {
        display: inline-block;
        transition: transform 0.05s ease;
    }

    .sub-caption {
        font-size: 1rem;
        color: #888888;
        margin: 0 0 10px 0;
        font-style: italic;
    }
</style>

<div class="content">
    <img id="muffin-img" src="{{ 'images/muffin.jpg' | relative_url }}" alt="Muffin the cat">
    <p>muffin so <span id="faaat-text" class="fat-text-container" title="Click me!">faaat</span></p> <br>
</div>

<script>
    const fatTextContainer = document.getElementById('faaat-text');
    let isAnimating = false;

    // Split text into individual span elements so they can hop independently
    function renderLetters(text) {
        fatTextContainer.innerHTML = '';
        for (let char of text) {
            const span = document.createElement('span');
            span.textContent = char;
            span.className = 'wave-letter';
            fatTextContainer.appendChild(span);
        }
    }

    // Initialize text
    renderLetters(fatTextContainer.textContent);

    function triggerWave() {
        if (isAnimating) return;
        isAnimating = true;

        const letters = fatTextContainer.querySelectorAll('.wave-letter');
        const totalLetters = letters.length;
        const durationPerLetter = 80; // ms delay between each letter starting its hop
        const hopDuration = 350; // duration of a single letter's up-and-down hop

        letters.forEach((letter, index) => {
            setTimeout(() => {
                let startTime = performance.now();
                
                function hop(currentTime) {
                    let elapsed = currentTime - startTime;
                    let progress = elapsed / hopDuration;

                    if (progress < 1) {
                        // Sine wave arc for smooth jump up and down (-20px peak)
                        let translateY = -Math.sin(progress * Math.PI) * 20;
                        letter.style.transform = `translateY(${translateY}px)`;
                        requestAnimationFrame(hop);
                    } else {
                        letter.style.transform = `translateY(0px)`;
                        
                        // When the very last letter finishes its hop, grow the text and unlock
                        if (index === totalLetters - 1) {
                            const extraLetter = Math.random() < 0.5 ? 'a' : 't';
                            fatTextContainer.textContent += extraLetter;
                            renderLetters(fatTextContainer.textContent);
                            isAnimating = false;
                        }
                    }
                }
                requestAnimationFrame(hop);
            }, index * durationPerLetter);
        });
    }

    fatTextContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerWave();
    });
</script>
