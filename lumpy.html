<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpy</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .content {
            text-align: center;
        }

        .content img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 8px;
            display: block;
            margin: 0 auto 20px auto;
        }

        .content p {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }

        .tap-hint {
            font-size: 0.9rem;
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="content">
        <img src="lumpy.jpg" alt="Lumpy the cat">
        <p>Don't forget her</p>
        <div id="hint" class="tap-hint">(Click anywhere for sound)</div>
    </div>

    <audio id="bg-audio" src="breakfastclub.mp3" loop></audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const hint = document.getElementById('hint');
        
        // Listen for the first touch or click anywhere on the screen
        function playAudio() {
            audio.play().then(() => {
                hint.style.display = 'none'; // Hide the hint once playing
            }).catch(err => console.log(err));
        }

        document.body.addEventListener('click', playAudio, { once: true });
        document.body.addEventListener('touchstart', playAudio, { once: true });
    </script>

</body>
</html>
