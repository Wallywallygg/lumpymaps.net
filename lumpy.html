<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpy</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            overflow-x: hidden;
        }
        header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            position: relative;
            z-index: 10;
        }
        header nav, 
        header nav a {
            color: #ffffff;
            text-decoration: none;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        .nacho-trigger {
            color: #ffffff;
            text-decoration: none;
        }
        .nacho-trigger:hover {
            text-decoration: underline;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #lumpy-img {
            max-width: 80vw;
            max-height: 60vh;
            object-fit: contain;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            margin-bottom: 20px;
        }
        /* Prominent main caption */
        .title-subtext {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 5px 0;
        }
        /* De-emphasized secondary instruction */
        .muted-subtext {
            font-size: 0.9rem;
            color: #888888;
            margin: 5px 0;
        }
        .house-of-lumpy {
            color: #0000FF !important;
            text-decoration: none;
        }
        .house-of-lumpy:hover {
            text-decoration: underline;
        }
        .mute-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #555555;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 20;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }
        .mute-btn:hover {
            opacity: 1;
            color: #888888;
        }
    </style>
</head>
<body>
    <header>
        <nav style="font-size: 1.1rem;">
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="sources/GISPortfolio.pdf">GIS Portfolio</a> |
            <a href="projects.html">Projects</a> |
            <a href="NACHO.html" id="nacho-link" class="nacho-trigger">Nacho</a>
        </nav>
    </header>

    <main>
        <img id="lumpy-img" src="images/lumpy.jpg" alt="Lumpy">
        <p class="title-subtext">Post this cat!</p>
        <p class="muted-subtext">(click anywhere to <a href="lumpy.html" class="house-of-lumpy">lump</a> around!)</p>
    </main>

    <!-- Discrete Music Mute Toggle -->
    <button id="mute-toggle" class="mute-btn">mute music</button>

    <!-- Audio Elements -->
    <audio id="bg-music" src="sources/breakfastclub.mp3" loop preload="auto"></audio>
    <audio id="meow-sound" src="sources/meow.wav" preload="auto"></audio>
    <audio id="dog-sound" src="sources/whatthedogdoin.wav" preload="auto"></audio>

    <script>
        let currentRotation = 0;
        let isMusicMuted = false;
        let audioUnlocked = false;

        const bgMusic = document.getElementById('bg-music');
        const meowSound = document.getElementById('meow-sound');
        const dogSound = document.getElementById('dog-sound');
        const lumpyImg = document.getElementById('lumpy-img');
        const muteBtn = document.getElementById('mute-toggle');
        const nachoLink = document.getElementById('nacho-link');

        // Unlock audio context on first click
        function unlockAudio() {
            if (!audioUnlocked) {
                if (!isMusicMuted) {
                    bgMusic.play().catch(() => {});
                }
                audioUnlocked = true;
            }
        }

        // Spin image and play meow SFX on page click
        document.body.addEventListener('click', (e) => {
            unlockAudio();

            // Ignore click if user clicked directly on nav links or mute button
            if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;

            currentRotation += 360;
            lumpyImg.style.transform = `rotate(${currentRotation}deg)`;

            // SFX always play on click
            meowSound.currentTime = 0;
            meowSound.play().catch(() => {});
        });

        // Toggle background music ONLY (leaves SFX untouched)
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMusicMuted = !isMusicMuted;
            muteBtn.textContent = isMusicMuted ? 'unmute music' : 'mute music';

            if (isMusicMuted) {
                bgMusic.pause();
            } else if (audioUnlocked) {
                bgMusic.play().catch(() => {});
            }
        });

        // Play dog sound effect when Nacho link is clicked
        nachoLink.addEventListener('click', (e) => {
            unlockAudio();
            e.preventDefault();

            dogSound.currentTime = 0;
            dogSound.play().catch(() => {});

            setTimeout(() => {
                window.location.href = nachoLink.href;
            }, 500);
        });
    </script>
</body>
</html>
