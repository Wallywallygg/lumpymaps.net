<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpy</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            overflow-x: hidden;
        }
        header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            position: relative;
            z-index: 10;
        }
        header nav, 
        header nav a {
            color: #ffffff;
            text-decoration: none;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        .nacho-trigger {
            color: #ffffff;
            text-decoration: none;
        }
        .nacho-trigger:hover {
            text-decoration: underline;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #lumpy-img {
            max-width: 80vw;
            max-height: 70vh;
            object-fit: contain;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .mute-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #333333;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 20;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }
        .mute-btn:hover {
            opacity: 1;
            color: #666666;
        }
    </style>
</head>
<body>
    <header>
        <nav style="font-size: 1.1rem;">
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="sources/GISPortfolio.pdf">GIS Portfolio</a> |
            <a href="projects.html">Projects</a> |
            <a href="NACHO.html" id="nacho-link" class="nacho-trigger">Nacho</a>
        </nav>
    </header>

    <main>
        <img id="lumpy-img" src="images/lumpy.jpg" alt="Lumpy">
    </main>

    <button id="mute-toggle" class="mute-btn">mute sfx</button>

    <!-- Audio Elements pointing to sources/ folder -->
    <audio id="bg-music" src="sources/breakfastclub.mp3" loop preload="auto"></audio>
    <audio id="meow-sound" src="sources/meow.wav" preload="auto"></audio>
    <audio id="dog-sound" src="sources/whatthedogdoin.wav" preload="auto"></audio>

    <script>
        let currentRotation = 0;
        let isMuted = false;
        let audioUnlocked = false;

        const bgMusic = document.getElementById('bg-music');
        const meowSound = document.getElementById('meow-sound');
        const dogSound = document.getElementById('dog-sound');
        const lumpyImg = document.getElementById('lumpy-img');
        const muteBtn = document.getElementById('mute-toggle');
        const nachoLink = document.getElementById('nacho-link');

        // Unlock audio context on first user interaction
        function unlockAudio() {
            if (!audioUnlocked) {
                bgMusic.play().catch(() => {});
                audioUnlocked = true;
            }
        }

        // Spin image and play meow sound on page click
        document.body.addEventListener('click', (e) => {
            unlockAudio();

            // Ignore click if user clicked directly on header nav links or mute button
            if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;

            currentRotation += 360;
            lumpyImg.style.transform = `rotate(${currentRotation}deg)`;

            // Play meow sound if SFX are not muted
            if (!isMuted) {
                meowSound.currentTime = 0;
                meowSound.play().catch(() => {});
            }
        });

        // Toggle sound effects without affecting background music
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            muteBtn.textContent = isMuted ? 'unmute sfx' : 'mute sfx';
            meowSound.muted = isMuted;
            dogSound.muted = isMuted;
        });

        // Play dog sound effect when Nacho link is clicked
        nachoLink.addEventListener('click', (e) => {
            unlockAudio();
            if (!isMuted) {
                e.preventDefault();
                dogSound.currentTime = 0;
                dogSound.play().catch(() => {});
                
                // Navigate to NACHO.html after sound starts
                setTimeout(() => {
                    window.location.href = nachoLink.href;
                }, 500);
            }
        });
    </script>
</body>
</html>
