<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpy</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            position: relative;
            z-index: 10;
        }

        header nav, 
        header nav a {
            color: #ffffff;
            text-decoration: none;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        .content {
            text-align: center;
            margin: auto;
        }

        .content img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 8px;
            display: block;
            margin: 0 auto 20px auto;
            will-change: transform;
        }

        .content p {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }

        .tap-hint {
            font-size: 0.9rem;
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <nav style="font-size: 2em;">
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="sources/GISPortfolio.pdf">GIS Portfolio</a> |
            <a href="projects.html">Projects</a> |
            <a href="NACHO.html">Nacho</a>
        </nav>
    </header>

    <div class="content">
        <img id="lumpy-img" src="images/lumpy.jpg" alt="Lumpy the cat">
        <p>Dont forget her</p>
        <div id="hint" class="tap-hint">(Tap anywhere for sound and spin)</div>
    </div>

    <!-- Background Music -->
    <audio id="bg-audio" src="sources/breakfastclub.mp3" loop></audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const hint = document.getElementById('hint');
        const lumpyImg = document.getElementById('lumpy-img');

        let currentRotation = 0;
        let speed = 0;
        const speedBoost = 12;
        const friction = 0.96;

        // Web Audio API Setup
        let audioCtx = null;
        let meowBuffer = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!meowBuffer) {
                fetch('sources/meow.wav')
                    .then(response => response.arrayBuffer())
                    .then(data => audioCtx.decodeAudioData(data))
                    .then(buffer => {
                        meowBuffer = buffer;
                    })
                    .catch(err => console.log('Error loading meow.wav:', err));
            }
        }

        function playPitchShiftedMeow() {
            if (!meowBuffer || !audioCtx) return;

            const source = audioCtx.createBufferSource();
            source.buffer = meowBuffer;

            // Random pitch multiplier between 0.6x (low) and 1.6x (high)
            const randomPitch = 0.6 + Math.random() * 1.0;
            source.playbackRate.value = randomPitch;

            source.connect(audioCtx.destination);
            source.start(0);
        }

        function playAudio() {
            audio.play().then(() => {
                hint.style.display = 'none';
            }).catch(err => console.log(err));
        }

        // Physics animation loop
        function animate() {
            if (Math.abs(speed) > 0.01) {
                currentRotation += speed;
                speed *= friction;
                lumpyImg.style.transform = `rotate(${currentRotation}deg)`;
            } else {
                speed = 0;
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Unified Click Handler
        function handleClick(e) {
            // Prevent navigation link clicks from triggering sound/spin
            if (e.target.tagName === 'A') return;

            // Initialize audio on first user click (fixes desktop autoplay policies)
            initAudioContext();
            playAudio();
            playPitchShiftedMeow();

            speed += speedBoost;
        }

        // Using pointerdown handles touch and click consistently without double-firing
        document.body.addEventListener('pointerdown', handleClick);
    </script>
</body>
</html>
