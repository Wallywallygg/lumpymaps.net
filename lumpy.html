<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpy</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Stacks header at top, content below */
            cursor: pointer;
        }

        /* Header positioned at top left with white links */
        header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: left; /* Left justification */
        }

        header nav, 
        header nav a {
            color: #ffffff; /* White text and separators */
            text-decoration: none;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        /* Centered cat image and text in remaining space */
        .content {
            text-align: center;
            margin: auto; /* Centers Lumpy perfectly in the middle */
        }

        .content img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 8px;
            display: block;
            margin: 0 auto 20px auto;
        }

        .content p {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }

        .tap-hint {
            font-size: 0.9rem;
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="portfolio.html">GIS Portfolio</a> |
            <a href="lumpy.html">In Memoriam</a>
        </nav>
    </header>

    <div class="content">
        <img src="lumpy.jpg" alt="Lumpy the cat">
        <p>Dont forget her</p>
        <div id="hint" class="tap-hint">(Tap anywhere for sound)</div>
    </div>

    <audio id="bg-audio" src="dota.mp3" loop></audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const hint = document.getElementById('hint');
                
        function playAudio() {
            audio.play().then(() => {
                hint.style.display = 'none';
            }).catch(err => console.log(err));
        }

        document.body.addEventListener('click', playAudio, { once: true });
        document.body.addEventListener('touchstart', playAudio, { once: true });
    </script>

</body>
</html>
