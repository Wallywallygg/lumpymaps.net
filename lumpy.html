<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpy</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Stacks header at top, content below */
            cursor: pointer;
            user-select: none; /* Prevents selecting text/images while clicking fast */
        }

        /* Header positioned at top left with white links */
        header {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: left; /* Left justification */
            position: relative;
            z-index: 10;
        }

        header nav, 
        header nav a {
            color: #ffffff; /* White text and separators */
            text-decoration: none;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        /* Centered cat image and text in remaining space */
        .content {
            text-align: center;
            margin: auto; /* Centers Lumpy perfectly in the middle */
        }

        .content img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 8px;
            display: block;
            margin: 0 auto 20px auto;
            will-change: transform; /* Helps render high-speed rotations smoothly */
        }

        .content p {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }

        .tap-hint {
            font-size: 0.9rem;
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <nav style="font-size: 2em;">
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="sources/GISPortfolio.pdf">GIS Portfolio</a> |
            <a href="projects.html">Projects</a> |
            <a href="lumpy.html">Lumpy</a>
        </nav>
    </header>

    <div class="content">
        <img id="lumpy-img" src="images/lumpy.jpg" alt="Lumpy the cat">
        <p>Dont forget her</p>
        <div id="hint" class="tap-hint">(Tap anywhere for sound and spin)</div>
    </div>

    <audio id="bg-audio" src="sources/breakfastclub.mp3" loop></audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const hint = document.getElementById('hint');
        const lumpyImg = document.getElementById('lumpy-img');

        let currentRotation = 0;
        let speed = 0;
        const speedBoost = 12; // Degrees added to speed per click
        const friction = 0.96;  // Deceleration factor (0.95-0.99 for smooth spin down)

        // 1. Audio logic
        function playAudio() {
            audio.play().then(() => {
                hint.style.display = 'none';
            }).catch(err => console.log(err));
        }

        // 2. Physics animation loop
        function animate() {
            if (Math.abs(speed) > 0.01) {
                currentRotation += speed;
                speed *= friction; // Gradual slowdown
                lumpyImg.style.transform = `rotate(${currentRotation}deg)`;
            } else {
                speed = 0;
            }
            requestAnimationFrame(animate);
        }
        animate(); // Start listening for frame updates

        // 3. Click/Tap handler
        function handleClick(e) {
            // Prevent clicks on navigation links from triggering spin physics or blocking redirection
            if (e.target.tagName === 'A') return;

            // Trigger audio on first click
            playAudio();

            // Add rotation speed
            speed += speedBoost;
        }

        document.body.addEventListener('click', handleClick);
        document.body.addEventListener('touchstart', handleClick);
    </script>
</body>
</html>
