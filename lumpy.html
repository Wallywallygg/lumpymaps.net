<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpymaps</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 1. Load the custom font */
        @font-face {
            font-family: 'Overwave';
            src: url('overwave.otf') format('opentype');
        }

        body {
            background-image: url('IMG20230806093151.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff; 
            margin: 0;
            padding: 0;
        }

        /* 2. Left-align the header at the top */
        header {
            text-align: left;
            padding: 20px;
        }

        /* 3. Apply the custom font and largest sizing to title */
        header h1 {
            font-family: 'Overwave', sans-serif;
            font-size: 3.5em; 
            margin: 0 0 10px 0;
        }

        /* Title link styling */
        header h1 a {
            color: #ffffff;
            text-decoration: none;
        }

        /* Navigation styling using custom font and 2em size */
        header nav, 
        header nav a {
            font-family: 'Overwave', sans-serif;
            font-size: 2em;
            color: #ffffff;
            text-decoration: none;
        }

        header nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <!-- Title hyperlinked to lumpymaps.net -->
        <h1><a href="https://lumpymaps.net">LUMPYMAPS.NET</a></h1>
        <nav>
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="portfolio.html">GIS Portfolio</a> |
            <a href="lumpy.html">In Memoriam</a>
        </nav>
    </header>

</body>
</html>
