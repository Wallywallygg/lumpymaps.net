<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Lumpymaps</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <style>
        /* Custom font setup for Overwave OTF */
        @font-face {
            font-family: 'OverwaveCustom';
            src: url('{{ "/sources/overwave.otf" | relative_url }}') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        header {
            text-align: left;
            margin-bottom: 40px;
        }
        /* Giant title scaling for homepage */
        header h1 {
            font-family: 'OverwaveCustom', Arial, sans-serif;
            font-size: clamp(3.5rem, 12vw, 7.5rem);
            line-height: 0.9;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
        }
        header h1 a {
            color: #000000;
            text-decoration: none;
        }
        header h1 a:hover {
            text-decoration: underline;
        }
        /* House of Lumpy signature blue link */
        .house-of-lumpy {
            color: #0000FF !important;
            text-decoration: none;
        }
        .house-of-lumpy:hover {
            text-decoration: underline;
        }
        /* Divider line between title and nav */
        .header-divider {
            border: 0;
            border-top: 2px solid #000000;
            margin: 0 0 20px 0;
        }
        /* Navigation menu below header with stronger emphasis */
        header nav {
            font-family: Arial, sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            color: #000000;
        }
        header nav a {
            color: #000000;
            text-decoration: none;
            padding: 0 2px;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        main section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    {% include header.html %}
    
    <main>
        {{ content }}
    </main>
</body>
</html>
