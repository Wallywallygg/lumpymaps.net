<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Lumpymaps</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

    <style>
        /* Custom font setup for Overwave OTF */
        @font-face {
            font-family: 'OverwaveCustom';
            src: url('{{ "/sources/overwave.otf" | relative_url }}') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        /* Crusty Tiled Background Modifier */
        body.crusty-home {
            background-repeat: repeat;
        }

        /* White container boxes for header & content readability */
        body.crusty-home header {
            background-color: #ffffff;
            padding: 20px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            width: 100%;
            overflow: hidden;
        }

        main section,
        main article,
        .content-box {
            background-color: #ffffff;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            width: 100%;
            overflow-wrap: break-word;
        }

        header {
            text-align: left;
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'OverwaveCustom', Arial, sans-serif;
            font-size: clamp(2.5rem, 9vw, 5.5rem);
            line-height: 0.9;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        header h1 a {
            color: #000000;
            text-decoration: none;
            display: inline-block;
            max-width: 100%;
        }
        header h1 a:hover {
            text-decoration: underline;
        }

        .house-of-lumpy {
            color: #0000FF !important;
            text-decoration: none;
        }
        .house-of-lumpy:hover {
            text-decoration: underline;
        }

        .header-divider {
            border: 0;
            border-top: 2px solid #000000;
            margin: 0 0 20px 0;
        }

        header nav {
            font-family: Arial, sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            color: #000000;
            word-break: break-word;
        }
        header nav a {
            color: #000000;
            text-decoration: none;
            padding: 0 2px;
        }
        header nav a:hover {
            text-decoration: underline;
        }

        main section {
            margin-bottom: 30px;
        }

        /* Retro 88x31 Footer Badges */
        .site-footer {
            margin-top: 40px;
            border-top: 2px solid #000000;
            padding-top: 15px;
            background-color: #ffffff;
            padding: 15px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
        }
        .site-footer p {
            font-size: 0.85rem;
            font-family: monospace;
            margin: 0 0 10px 0;
        }
        .web-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .web-badges img {
            width: 88px;
            height: 31px;
            image-rendering: pixelated;
            border: 1px solid #000000;
        }
    </style>
</head>
<body class="{{ page.body_class }}">
    {% include header.html %}
    
    <main>
        {{ content }}
    </main>

<!-- Retro Footer with RSS & Loadsamoney Badges -->
    <footer class="site-footer">
        <p>If u dont know where u came from, how are u gonna know where u are?</p>
        <div class="web-badges">
            <a href="{{ '/feed.xml' | relative_url }}" target="_blank">
                <img src="{{ '/images/rssicon.png' | relative_url }}" alt="Blog RSS">
            </a>
            <a href="https://www.youtube.com/watch?v=ULeDlxa3gyc" target="_blank">
                <img src="{{ '/images/loadsamoney.png' | relative_url }}" alt="Loadsamoney">
            </a>
             <a href="https://qgis.org/" target="_blank">
                <img src="{{ '/images/qgis88x31.png' | relative_url }}" alt="QGIS">
            </a>
        </div>
    </footer>

    {% if page.body_class == 'crusty-home' %}
    <script>
      (function() {
        // Collect all background filenames present in your /images/background/ folder
        var bgImages = [
          {% assign bg_files = site.static_files | where_exp: "file", "file.path contains '/images/background/'" %}
          {% for file in bg_files %}
            "{{ file.path | relative_url }}"{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ];

        // Fallback array in case Jekyll static file listing is empty
        if (!bgImages || bgImages.length === 0) {
          bgImages = ["{{ '/images/background/IMG_3942.JPG' | relative_url }}"];
        }

        // Pick a random image on each page load
        var chosenBg = bgImages[Math.floor(Math.random() * bgImages.length)];
        document.body.style.backgroundImage = 'url("' + chosenBg + '")';
      })();
    </script>
    {% endif %}
</body>
</html>
