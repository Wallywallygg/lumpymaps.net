<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Lumpymaps</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <style>
        /* Custom font setup for Overwave OTF */
        @font-face {
            font-family: 'OverwaveCustom';
            src: url('{{ "/sources/overwave.otf" | relative_url }}') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        /* Crusty Tiled Background Modifier */
        body.crusty-home {
            background-image: url('{{ "/images/background/IMG_3942.JPG" | relative_url }}');
            background-repeat: repeat;
        }

        /* White container boxes for header & content readability */
        body.crusty-home header {
            background-color: #ffffff;
            padding: 20px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            width: 100%;
            overflow: hidden; /* Keeps overflowing glyphs clipped inside */
        }

        main section,
        main article,
        .content-box {
            background-color: #ffffff;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            width: 100%;
            overflow-wrap: break-word;
        }

        header {
            text-align: left;
            margin-bottom: 40px;
        }

        /* Giant title scaling optimized for mobile/Apple viewports */
        header h1 {
            font-family: 'OverwaveCustom', Arial, sans-serif;
            font-size: clamp(2.5rem, 9vw, 5.5rem);
            line-height: 0.9;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        header h1 a {
            color: #000000;
            text-decoration: none;
            display: inline-block;
            max-width: 100%;
        }
        header h1 a:hover {
            text-decoration: underline;
        }

        /* House of Lumpy signature blue link */
        .house-of-lumpy {
            color: #0000FF !important;
            text-decoration: none;
        }
        .house-of-lumpy:hover {
            text-decoration: underline;
        }

        /* Divider line between title and nav */
        .header-divider {
            border: 0;
            border-top: 2px solid #000000;
            margin: 0 0 20px 0;
        }

        /* Navigation menu below header with stronger emphasis */
        header nav {
            font-family: Arial, sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            color: #000000;
            word-break: break-word;
        }
        header nav a {
            color: #000000;
            text-decoration: none;
            padding: 0 2px;
        }
        header nav a:hover {
            text-decoration: underline;
        }

        main section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body class="{{ page.body_class }}">
    {% include header.html %}
    
    <main>
        {{ content }}
    </main>
</body>
</html>
