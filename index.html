<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpymaps - Homepage</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom font setup */
        @font-face {
            font-family: 'Overwave';
            src: url('sources/overwave.otf') format('opentype'),
                 url('sources/overwave.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        header {
            text-align: left;
            margin-bottom: 40px;
        }
        /* Giant title scaling for homepage */
        header h1 {
            font-family: 'Overwave', Impact, sans-serif;
            font-size: clamp(3.5rem, 12vw, 7.5rem);
            line-height: 0.9;
            margin: 0 0 15px 0;
        }
        header h1 a {
            color: #000000;
            text-decoration: none;
        }
        header h1 a:hover {
            text-decoration: none;
        }
        /* House of Lumpy blue link style */
        .house-of-lumpy {
            color: #0000FF !important;
            text-decoration: none;
        }
        .house-of-lumpy:hover {
            text-decoration: underline;
        }
        nav a {
            color: #000000;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="lumpy.html" class="house-of-lumpy">lumpy</a><a href="index.html">maps.net</a></h1>
        <nav style="font-size: 2em;">

            <a href="blog.html">Blog</a> |
            <a href="sources/GISPortfolio.pdf">GIS Portfolio</a> |

    </header>
</body>
</html>
