<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpymaps</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom font setup */
        @font-face {
            font-family: 'Overwave';
            src: url('./overwave.otf') format('opentype'),
                 url('./overwave.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: left;
            margin-bottom: 40px;
        }

        /* Giant title scaling for homepage */
        header h1 {
            font-family: 'Overwave', Impact, sans-serif;
            font-size: clamp(3.5rem, 12vw, 7.5rem);
            line-height: 0.9;
            margin: 0 0 15px 0;
            letter-spacing: -2px;
        }

        header h1 a {
            color: #000000;
            text-decoration: none;
        }

        /* Navigation menu below header */
        header nav, 
        header nav a {
            font-family: Arial, sans-serif;
            font-size: 1.1rem;
            color: #000000;
            text-decoration: none;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        main section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">LUMPYMAPS.NET</a></h1>
        <nav>
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="portfolio.html">GIS Portfolio</a> |
            <a href="lumpy.html">Lumpy</a>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About</h2>
            <p>Welcome to my site. I work in GIS and build stuff.</p>
        </section>
    </main>
</body>
</html>
