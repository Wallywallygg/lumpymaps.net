<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpymaps</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 1. Fix custom font loading for GitHub Pages */
        @font-face {
            font-family: 'Overwave';
            src: url('./overwave.otf') format('opentype'),
                 url('overwave.otf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* 2. Reverted background back to plain light background */
        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 3. Left-align header at top */
        header {
            text-align: left;
            padding: 20px;
        }

        /* Title styling with Overwave font */
        header h1 {
            font-family: 'Overwave', Impact, sans-serif;
            font-size: 3.5em; 
            margin: 0 0 10px 0;
        }

        header h1 a {
            color: #000000;
            text-decoration: none;
        }

        /* Navigation styling with Overwave font and updated "Lumpy" text */
        header nav, 
        header nav a {
            font-family: 'Overwave', Impact, sans-serif;
            font-size: 2em;
            color: #000000;
            text-decoration: none;
        }

        header nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1><a href="https://lumpymaps.net">LUMPYMAPS.NET</a></h1>
        <nav>
            <a href="index.html">Homepage</a> |
            <a href="blog.html">Blog</a> |
            <a href="portfolio.html">GIS Portfolio</a> |
            <a href="lumpy.html">Lumpy</a>
        </nav>
    </header>

</body>
</html>
